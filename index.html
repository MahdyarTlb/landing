<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لانچ شد! متانیکس اومد!</title>
    <link rel="icon" type="image/x-icon" href="main-tr.png" />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- لوگو -->
      <div class="logo-container">
        <div class="logo-glow"></div>
        <img src="main-tr.png" alt="Logo" class="logo" id="logo" />
      </div>

      <!-- تایمر + متن لانچ (JS پر می‌کنه) -->
      <div class="timer-container">
        <div class="timer" id="timer"></div>
        <div class="launched-text">
          <h2>موعد تموم شد!</h2>
          <p>لینک اصلی همین الان باز شد!</p>
        </div>
      </div>

      <!-- دکمه اصلی خفن -->
      <div class="entry-button">
        <a href="https://evnd.co/bga7O" target="_blank" class="main-cta">
          <span>لینک اصلی رو ببین</span>
          <div class="shine"></div>
          <div class="pulse"></div>
          <div class="hover-explosion"></div>
        </a>
      </div>

      <!-- دکمه‌های اجتماعی -->
      <div class="social-links">
        <a href="https://t.me/metanix_ir" target="_blank" class="social-btn telegram">
          تلگرام
        </a>
        <a href="https://instagram.com/metanix_ir" target="_blank" class="social-btn instagram">
          اینستاگرام
        </a>
      </div>
    </div>

    <!-- بک‌گراند -->
    <div class="bg-animation">
      <!-- همون قبلی -->
      <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
      <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
      <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
      <div class="energy-wave"></div><div class="energy-wave"></div><div class="energy-wave"></div><div class="energy-wave"></div>
      <div class="energy-wave"></div><div class="energy-wave"></div>
      <div class="energy-line"></div><div class="energy-line"></div><div class="energy-line"></div><div class="energy-line"></div>
      <div class="glow-dot"></div><div class="glow-dot"></div><div class="glow-dot"></div><div class="glow-dot"></div>
      <div class="glow-dot"></div><div class="glow-dot"></div>
      <div class="floating-logo"><img src="main-tr.png" alt=""></div>
      <div class="floating-logo"><img src="main-tr.png" alt=""></div>
      <div class="floating-logo"><img src="main-tr.png" alt=""></div>
      <div class="floating-logo"><img src="main-tr.png" alt=""></div>
      <div class="floating-logo"><img src="main-tr.png" alt=""></div>
      <div class="floating-logo"><img src="main-tr.png" alt=""></div>
      <div class="floating-logo"><img src="main-tr.png" alt=""></div>
      <div class="floating-logo"><img src="main-tr.png" alt=""></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
