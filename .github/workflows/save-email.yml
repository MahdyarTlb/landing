name: Save Email

on:
  issues:
    types: [opened]

jobs:
  save-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Add email to file
        run: |
          EMAIL=$(echo "${{ github.event.issue.title }}" | grep -Eo "[^ ]+@[^ ]+")
          if [ ! -z "$EMAIL" ]; then
            jq ". += [\"$EMAIL\"]" emails.json > tmp.json && mv tmp.json emails.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add emails.json
            git commit -m "Add $EMAIL"
            git push
          fi
