name: Save Email

on:
  repository_dispatch:
    types: [new_email]

jobs:
  save-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add email to file
        run: |
          EMAIL="${{ github.event.client_payload.email }}"
          NAME="${{ github.event.client_payload.name }}"
          jq ". += [{\"name\": \"$NAME\", \"email\": \"$EMAIL\", \"timestamp\": \"$(date -Iseconds)\"}]" emails.json > tmp.json && mv tmp.json emails.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add emails.json
          git commit -m "Add email: $EMAIL"
          git push
